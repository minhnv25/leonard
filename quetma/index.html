<!doctype html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Trạm Quét Mã</title>
<meta name="description" content="Quét QR và mã vạch hàng loạt, gộp mã trùng, xuất Excel/CSV, báo hiệu bíp và rung.">
<meta name="theme-color" content="#0F5C56">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Trạm Quét Mã">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">

<style>
  :root {
    color-scheme: light;
    --bg: #F7F7F5;
    --surface: #FFFFFF;
    --surface-sunken: #EFEFEC;
    --text: #14181C;
    --text-muted: #5B6570;
    --primary: #0F5C56;
    --primary-strong: #0B433F;
    --on-primary: #FFFFFF;
    --accent: #C9860E;
    --border: #DEE3E1;
    --danger: #B0362E;
    --success: #256B4C;
    --shadow: 0 1px 2px rgba(20,24,28,0.06), 0 4px 12px rgba(20,24,28,0.06);
    --font-display: 'Barlow Semi Condensed', sans-serif;
    --font-body: 'IBM Plex Sans', sans-serif;
    --font-mono: 'IBM Plex Mono', monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg: #10151A;
      --surface: #1A2129;
      --surface-sunken: #141A20;
      --text: #EDEFEF;
      --text-muted: #9AA5AC;
      --primary: #3FA79B;
      --primary-strong: #55BDB1;
      --on-primary: #06201D;
      --accent: #E8A93D;
      --border: #2A333B;
      --danger: #E5695F;
      --success: #57C08C;
      --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 4px 16px rgba(0,0,0,0.35);
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #10151A;
    --surface: #1A2129;
    --surface-sunken: #141A20;
    --text: #EDEFEF;
    --text-muted: #9AA5AC;
    --primary: #3FA79B;
    --primary-strong: #55BDB1;
    --on-primary: #06201D;
    --accent: #E8A93D;
    --border: #2A333B;
    --danger: #E5695F;
    --success: #57C08C;
    --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 4px 16px rgba(0,0,0,0.35);
  }

  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-body);
    font-size: 15px;
    line-height: 1.5;
    padding-inline: 16px;
    display: flex;
    flex-direction: column;
    -webkit-tap-highlight-color: transparent;
  }
  h1, h2, h3 { font-family: var(--font-display); text-wrap: balance; margin: 0; }
  button { font-family: inherit; }

  header.topbar {
    position: sticky;
    top: env(safe-area-inset-top, 0px);
    z-index: 20;
    background: var(--bg);
    padding-block: 14px 10px;
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    flex-wrap: wrap;
    row-gap: 6px;
    gap: 12px;
    border-bottom: 1px solid var(--border);
  }
  header.topbar .brand {
    display: flex;
    align-items: baseline;
    gap: 8px;
  }
  header.topbar h1 {
    font-size: 21px;
    font-weight: 700;
    letter-spacing: 0.2px;
    white-space: nowrap;
  }
  header.topbar .tag {
    font-size: 11px;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    white-space: nowrap;
  }
  @media (max-width: 360px) {
    header.topbar .tag { display: none; }
  }
  .stats {
    display: flex;
    gap: 16px;
    font-variant-numeric: tabular-nums;
    margin-left: auto;
  }
  @media (max-width: 420px) {
    .stats { width: 100%; justify-content: space-between; margin-left: 0; }
  }
  .stat {
    display: flex;
    align-items: baseline;
    gap: 5px;
    white-space: nowrap;
  }
  .stat .n { font-size: 15px; font-weight: 700; font-family: var(--font-mono); }
  .stat .l { font-size: 10.5px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.04em; }

  main {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 16px;
    padding-block: 16px calc(78px + env(safe-area-inset-bottom, 0px));
    max-width: 640px;
    width: 100%;
    margin-inline: auto;
  }

  .scanner-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    box-shadow: var(--shadow);
    overflow: hidden;
  }
  .scanner-viewport {
    position: relative;
    width: 100%;
    aspect-ratio: 4 / 3;
    background: var(--surface-sunken);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #reader {
    width: 100% !important;
    height: 100% !important;
  }
  #reader video { object-fit: cover; width: 100% !important; height: 100% !important; }
  #reader img { display: none; }

  .scan-flash {
    position: absolute;
    inset: 0;
    background: var(--success);
    opacity: 0;
    pointer-events: none;
  }
  .scan-flash.dup { background: var(--accent); }
  .scan-flash.on { animation: flash 380ms ease-out; }
  @keyframes flash { 0% { opacity: 0.35; } 100% { opacity: 0; } }

  .scanner-controls {
    display: flex;
    gap: 10px;
    padding: 12px;
    border-top: 1px solid var(--border);
    align-items: center;
    flex-wrap: wrap;
  }
  .scanner-overlay {
    position: absolute;
    top: 12px;
    right: 12px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    z-index: 6;
  }
  .overlay-btn {
    appearance: none;
    width: 42px; height: 42px;
    border-radius: 50%;
    border: none;
    background: rgba(15,20,24,0.55);
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: var(--font-mono);
    font-size: 11.5px;
    font-weight: 700;
    cursor: pointer;
    flex-shrink: 0;
    backdrop-filter: blur(3px);
    -webkit-backdrop-filter: blur(3px);
  }
  .overlay-btn.active { background: var(--accent); color: #201703; }
  .overlay-btn:active { transform: scale(0.92); }
  .status-dot {
    width: 9px; height: 9px; border-radius: 50%;
    background: var(--text-muted);
    flex-shrink: 0;
  }
  .status-dot.live { background: var(--success); box-shadow: 0 0 0 3px color-mix(in srgb, var(--success) 25%, transparent); animation: pulse 1.6s infinite; }
  @keyframes pulse { 0%,100% { box-shadow: 0 0 0 3px color-mix(in srgb, var(--success) 25%, transparent);} 50% { box-shadow: 0 0 0 6px color-mix(in srgb, var(--success) 10%, transparent);} }
  .status-text { font-size: 12.5px; color: var(--text-muted); flex: 1; }

  .btn {
    appearance: none;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    border-radius: 9px;
    padding: 10px 14px;
    font-size: 13.5px;
    font-weight: 600;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    justify-content: center;
    transition: transform 80ms ease;
  }
  .btn:active { transform: scale(0.97); }
  .btn:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
  .btn-primary { background: var(--primary); border-color: var(--primary); color: var(--on-primary); }
  .btn.active { background: var(--primary); border-color: var(--primary); color: var(--on-primary); }
  .btn-primary.stop { background: var(--danger); border-color: var(--danger); }
  .btn-ghost { background: transparent; border-color: transparent; color: var(--primary); padding: 8px 6px; }
  .btn-sm { padding: 7px 10px; font-size: 12.5px; }
  .btn-block { width: 100%; }
  .btn[disabled] { opacity: 0.45; cursor: default; }

  .manual-row {
    display: flex;
    gap: 8px;
  }
  .manual-row input {
    flex: 1;
    min-width: 0;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    border-radius: 9px;
    padding: 10px 12px;
    font-family: var(--font-mono);
    font-size: 14px;
  }
  .manual-row input:focus-visible { outline: 2px solid var(--primary); outline-offset: 1px; }

  .export-panel {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px 14px;
  }
  .panel-label {
    display: block;
    font-size: 11px;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.05em;
    margin-bottom: 6px;
  }

  .export-fields {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .filename-row {
    display: flex;
    flex-direction: column;
    gap: 5px;
    margin-bottom: 10px;
  }
  .filename-row span {
    font-size: 11px;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }
  .filename-row input[type="text"] {
    border: 1px solid var(--border);
    background: var(--surface-sunken);
    color: var(--text);
    border-radius: 8px;
    padding: 9px 11px;
    font-family: var(--font-mono);
    font-size: 13.5px;
    width: 100%;
  }
  .filename-row input[type="text"]:focus-visible { outline: 2px solid var(--primary); outline-offset: 1px; }

  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(10,14,17,0.55);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    z-index: 100;
  }
  .modal-card {
    background: var(--surface);
    border-radius: 16px;
    padding: 20px;
    width: 100%;
    max-width: 340px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.28);
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .modal-card h3 { font-size: 17px; font-weight: 700; }
  .modal-actions {
    display: flex;
    gap: 10px;
  }
  .modal-actions .btn { flex: 1; }
  .export-fields label {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 7px 2px;
    font-size: 13px;
    color: var(--text);
  }
  .export-fields label.locked { color: var(--text-muted); }
  .export-fields input[type="checkbox"] {
    width: 17px; height: 17px;
    accent-color: var(--primary);
    flex-shrink: 0;
  }

  section.results {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .results-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .results-head h2 { font-size: 15px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; }

  .empty-state {
    background: var(--surface);
    border: 1px dashed var(--border);
    border-radius: 12px;
    padding: 28px 16px;
    text-align: center;
    color: var(--text-muted);
    font-size: 13px;
  }

  ul.entry-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
  .entry {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 11px;
    padding: 10px 12px;
    display: flex;
    align-items: center;
    gap: 10px;
    box-shadow: var(--shadow);
  }
  .entry.new { animation: pop 320ms ease; }
  @keyframes pop { 0% { transform: scale(0.97); } 60% { transform: scale(1.01); } 100% { transform: scale(1); } }
  .entry-main { flex: 1; min-width: 0; }
  .entry-code {
    font-family: var(--font-mono);
    font-size: 14px;
    font-weight: 600;
    overflow-wrap: anywhere;
  }
  .entry-meta {
    display: flex;
    gap: 8px;
    margin-top: 3px;
    font-size: 11px;
    color: var(--text-muted);
    flex-wrap: wrap;
  }
  .badge {
    font-size: 10.5px;
    font-weight: 600;
    padding: 2px 7px;
    border-radius: 999px;
    background: var(--surface-sunken);
    color: var(--text-muted);
    letter-spacing: 0.02em;
  }
  .badge.count { background: color-mix(in srgb, var(--accent) 18%, transparent); color: var(--accent); }
  .entry-del {
    flex-shrink: 0;
    width: 30px; height: 30px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text-muted);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
  }
  .entry-del:active { transform: scale(0.95); }

  footer.actionbar {
    position: sticky;
    bottom: 0;
    padding-bottom: calc(12px + env(safe-area-inset-bottom, 0px));
    padding-top: 10px;
    background: linear-gradient(to top, var(--bg) 65%, transparent);
    display: flex;
    gap: 8px;
  }
  footer.actionbar .btn { flex: 1; }

  @media (prefers-reduced-motion: reduce) {
    .entry.new, .scan-flash.on, .status-dot.live { animation: none; }
  }
</style>
</head>
<body>

<header class="topbar">
  <div class="brand">
    <h1>Trạm Quét Mã</h1>
    <span class="tag">QR · Barcode</span>
  </div>
  <div class="stats">
    <div class="stat"><span class="l">Mã duy nhất</span><span class="n" id="statUnique">0</span></div>
    <div class="stat"><span class="l">Lượt quét</span><span class="n" id="statTotal">0</span></div>
  </div>
</header>

<main>

  <div class="scanner-card">
    <div class="scanner-viewport">
      <div id="reader"></div>
      <div class="scan-flash" id="scanFlash"></div>
      <div class="scanner-overlay" id="scannerOverlay" hidden>
        <button class="overlay-btn" id="torchBtn" hidden aria-label="Bật/tắt đèn flash">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M13 2 4 14h6l-1 8 9-12h-6l1-8Z"/></svg>
        </button>
        <button class="overlay-btn" id="zoomBtn" hidden aria-label="Đổi mức zoom">
          <span id="zoomLabel">1×</span>
        </button>
        <button class="overlay-btn" id="switchCamBtn" aria-label="Đổi camera">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 2 21 6l-4 4"/><path d="M21 6H8a4 4 0 0 0-4 4v1"/><path d="M7 22 3 18l4-4"/><path d="M3 18h13a4 4 0 0 0 4-4v-1"/></svg>
        </button>
      </div>
    </div>
    <div class="scanner-controls">
      <span class="status-dot" id="statusDot"></span>
      <span class="status-text" id="statusText">Camera đang tắt</span>
      <button class="btn btn-primary" id="toggleBtn">Bắt đầu quét</button>
    </div>
  </div>

  <div class="manual-row">
    <input type="text" id="manualInput" placeholder="Nhập mã thủ công…" inputmode="text" autocomplete="off">
    <button class="btn" id="manualAddBtn">Thêm</button>
  </div>

  <div class="export-panel" id="exportPanel" hidden>
    <span class="panel-label">Thông tin đưa vào file</span>
    <div class="export-fields">
      <label class="locked"><input type="checkbox" checked disabled> Mã (luôn có)</label>
      <label><input type="checkbox" data-field="format" checked> Định dạng mã</label>
      <label><input type="checkbox" data-field="count" checked> Số lần quét</label>
      <label><input type="checkbox" data-field="firstTime" checked> Lần đầu quét</label>
      <label><input type="checkbox" data-field="lastTime" checked> Lần quét cuối</label>
    </div>
  </div>

  <section class="results">
    <div class="results-head">
      <h2>Kết quả</h2>
      <button class="btn btn-ghost btn-sm" id="clearAllBtn">Xóa tất cả</button>
    </div>
    <div class="empty-state" id="emptyState">Chưa có mã nào được quét.</div>
    <ul class="entry-list" id="entryList"></ul>
  </section>

</main>

<footer class="actionbar">
  <button class="btn" id="exportOptionsBtn">Tùy chọn</button>
  <button class="btn" id="exportCsvBtn">Xuất CSV</button>
  <button class="btn btn-primary" id="exportXlsxBtn">Xuất Excel</button>
</footer>

<div class="modal-overlay" id="exportModalOverlay" hidden>
  <div class="modal-card">
    <h3 id="exportModalTitle">Xuất file</h3>
    <label class="filename-row">
      <span>Tên file</span>
      <input type="text" id="filenameInput" autocomplete="off" spellcheck="false">
    </label>
    <div class="modal-actions">
      <button class="btn" id="exportModalCancel">Hủy</button>
      <button class="btn btn-primary" id="exportModalConfirm">Xuất file</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script>
(function () {
  "use strict";

  /** ---------- State ---------- **/
  var entries = new Map();   // code -> {code, format, count, firstTime, lastTime}
  var lastSeenAt = new Map(); // code -> timestamp, for debounce
  var html5QrCode = null;
  var scanning = false;
  var order = [];            // codes in most-recent-first order

  var DEBOUNCE_MS = 1400;

  /** ---------- DOM refs ---------- **/
  var readerEl = document.getElementById('reader');
  var flashEl = document.getElementById('scanFlash');
  var toggleBtn = document.getElementById('toggleBtn');
  var statusDot = document.getElementById('statusDot');
  var statusText = document.getElementById('statusText');
  var entryList = document.getElementById('entryList');
  var emptyState = document.getElementById('emptyState');
  var statUnique = document.getElementById('statUnique');
  var statTotal = document.getElementById('statTotal');
  var manualInput = document.getElementById('manualInput');
  var manualAddBtn = document.getElementById('manualAddBtn');
  var clearAllBtn = document.getElementById('clearAllBtn');
  var exportCsvBtn = document.getElementById('exportCsvBtn');
  var exportXlsxBtn = document.getElementById('exportXlsxBtn');
  var exportOptionsBtn = document.getElementById('exportOptionsBtn');
  var exportPanel = document.getElementById('exportPanel');
  var filenameInput = document.getElementById('filenameInput');
  var exportModalOverlay = document.getElementById('exportModalOverlay');
  var exportModalTitle = document.getElementById('exportModalTitle');
  var exportModalCancel = document.getElementById('exportModalCancel');
  var exportModalConfirm = document.getElementById('exportModalConfirm');
  var scannerOverlay = document.getElementById('scannerOverlay');
  var torchBtn = document.getElementById('torchBtn');
  var zoomBtn = document.getElementById('zoomBtn');
  var zoomLabel = document.getElementById('zoomLabel');
  var switchCamBtn = document.getElementById('switchCamBtn');
  var torchOn = false;
  var currentFacing = 'environment';
  var zoomLevels = [];
  var zoomIndex = 0;

  /** ---------- Feedback: beep + vibrate ---------- **/
  var audioCtx = null;
  function beep(freq, dur) {
    freq = freq || 1046.5; dur = dur || 110;
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      var osc = audioCtx.createOscillator();
      var gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0.0001, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.35, audioCtx.currentTime + 0.01);
      gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + dur / 1000);
      osc.connect(gain).connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + dur / 1000 + 0.02);
    } catch (e) { /* audio not available, ignore */ }
  }
  function vibrate(pattern) {
    try { if (navigator.vibrate) navigator.vibrate(pattern); } catch (e) { /* ignore */ }
  }

  function flash(isDup) {
    flashEl.classList.remove('on', 'dup');
    void flashEl.offsetWidth; // restart animation
    if (isDup) flashEl.classList.add('dup');
    flashEl.classList.add('on');
  }

  /** ---------- Data handling ---------- **/
  function fmtTime(d) {
    return d.toLocaleTimeString('vi-VN', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
  }

  function registerCode(code, format) {
    var now = Date.now();
    var last = lastSeenAt.get(code) || 0;
    if (now - last < DEBOUNCE_MS) return; // ignore rapid re-triggers of same code in frame
    lastSeenAt.set(code, now);

    var isDup = entries.has(code);
    if (isDup) {
      var e = entries.get(code);
      e.count += 1;
      e.lastTime = new Date();
      order = order.filter(function (c) { return c !== code; });
      order.unshift(code);
    } else {
      entries.set(code, {
        code: code,
        format: format || 'Không rõ',
        count: 1,
        firstTime: new Date(),
        lastTime: new Date()
      });
      order.unshift(code);
    }

    beep(isDup ? 740 : 1175, isDup ? 90 : 120);
    vibrate(isDup ? 60 : [40, 40, 40]);
    flash(isDup);
    renderList(code);
  }

  function removeCode(code) {
    entries.delete(code);
    lastSeenAt.delete(code);
    order = order.filter(function (c) { return c !== code; });
    renderList();
  }

  function clearAll() {
    if (entries.size === 0) return;
    if (!window.confirm) {
      entries.clear(); lastSeenAt.clear(); order = []; renderList();
      return;
    }
    var ok = window.confirm('Xóa toàn bộ ' + entries.size + ' mã đã quét?');
    if (ok) {
      entries.clear();
      lastSeenAt.clear();
      order = [];
      renderList();
    }
  }

  /** ---------- Rendering ---------- **/
  function renderList(highlightCode) {
    var total = 0;
    entries.forEach(function (e) { total += e.count; });
    statUnique.textContent = String(entries.size);
    statTotal.textContent = String(total);

    emptyState.hidden = entries.size !== 0;
    entryList.innerHTML = '';

    order.forEach(function (code) {
      var e = entries.get(code);
      if (!e) return;
      var li = document.createElement('li');
      li.className = 'entry' + (code === highlightCode ? ' new' : '');

      var main = document.createElement('div');
      main.className = 'entry-main';

      var codeEl = document.createElement('div');
      codeEl.className = 'entry-code';
      codeEl.textContent = e.code;

      var meta = document.createElement('div');
      meta.className = 'entry-meta';

      var fmtBadge = document.createElement('span');
      fmtBadge.className = 'badge';
      fmtBadge.textContent = e.format;
      meta.appendChild(fmtBadge);

      if (e.count > 1) {
        var countBadge = document.createElement('span');
        countBadge.className = 'badge count';
        countBadge.textContent = '×' + e.count;
        meta.appendChild(countBadge);
      }

      var timeSpan = document.createElement('span');
      timeSpan.textContent = fmtTime(e.firstTime) + (e.count > 1 ? ' → ' + fmtTime(e.lastTime) : '');
      meta.appendChild(timeSpan);

      main.appendChild(codeEl);
      main.appendChild(meta);

      var delBtn = document.createElement('button');
      delBtn.className = 'entry-del';
      delBtn.setAttribute('aria-label', 'Xóa mã ' + e.code);
      delBtn.innerHTML = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg>';
      delBtn.addEventListener('click', function () { removeCode(code); });

      li.appendChild(main);
      li.appendChild(delBtn);
      entryList.appendChild(li);
    });
  }

  /** ---------- Camera scanning ---------- **/
  function onScanSuccess(decodedText, decodedResult) {
    var format = 'Không rõ';
    try {
      if (decodedResult && decodedResult.result && decodedResult.result.format && decodedResult.result.format.formatName) {
        format = decodedResult.result.format.formatName;
      }
    } catch (e) { /* ignore */ }
    registerCode(decodedText, format);
  }

  function onScanFailure() { /* per-frame miss, ignore silently */ }

  function setScanningUI(isOn) {
    scanning = isOn;
    statusDot.classList.toggle('live', isOn);
    statusText.textContent = isOn ? 'Đang quét…' : 'Camera đang tắt';
    toggleBtn.textContent = isOn ? 'Dừng quét' : 'Bắt đầu quét';
    toggleBtn.classList.toggle('stop', isOn);
    scannerOverlay.hidden = !isOn;
    if (!isOn) {
      torchBtn.hidden = true;
      zoomBtn.hidden = true;
      torchOn = false;
      torchBtn.classList.remove('active');
      zoomLevels = [];
      zoomIndex = 0;
    }
  }

  function roundZoom(v) {
    return Math.round(v * 10) / 10;
  }

  function setupTrackControls() {
    torchBtn.hidden = true;
    zoomBtn.hidden = true;
    if (!html5QrCode || !html5QrCode.getRunningTrackCapabilities) return;
    var caps = {};
    try { caps = html5QrCode.getRunningTrackCapabilities() || {}; } catch (e) { caps = {}; }

    if (caps.torch) {
      torchBtn.hidden = false;
    }
    if (caps.zoom && caps.zoom.min != null && caps.zoom.max != null && caps.zoom.max > caps.zoom.min) {
      var min = caps.zoom.min, max = caps.zoom.max;
      var mid = roundZoom(min + (max - min) / 2);
      zoomLevels = [roundZoom(min), mid, roundZoom(max)].filter(function (v, i, arr) {
        return arr.indexOf(v) === i;
      });
      var current = 1;
      try {
        var settings = html5QrCode.getRunningTrackSettings();
        if (settings && settings.zoom) current = roundZoom(settings.zoom);
      } catch (e) { /* ignore */ }
      zoomIndex = zoomLevels.indexOf(current);
      if (zoomIndex === -1) zoomIndex = 0;
      zoomLabel.textContent = zoomLevels[zoomIndex] + '×';
      zoomBtn.hidden = false;
    }
  }

  torchBtn.addEventListener('click', function () {
    if (!html5QrCode) return;
    torchOn = !torchOn;
    try {
      html5QrCode.applyVideoConstraints({ advanced: [{ torch: torchOn }] });
      torchBtn.classList.toggle('active', torchOn);
    } catch (e) {
      torchOn = false;
      alert('Thiết bị này không hỗ trợ bật đèn flash qua trình duyệt.');
    }
  });

  zoomBtn.addEventListener('click', function () {
    if (!html5QrCode || zoomLevels.length === 0) return;
    zoomIndex = (zoomIndex + 1) % zoomLevels.length;
    var level = zoomLevels[zoomIndex];
    try {
      html5QrCode.applyVideoConstraints({ advanced: [{ zoom: level }] });
      zoomLabel.textContent = level + '×';
    } catch (e) { /* ignore */ }
  });

  switchCamBtn.addEventListener('click', function () {
    if (!scanning) return;
    currentFacing = currentFacing === 'environment' ? 'user' : 'environment';
    switchCamBtn.classList.toggle('active', currentFacing === 'user');
    stopScanning(startScanning);
  });

  function buildScanConfig() {
    return {
      fps: 15,
      qrbox: function (vw, vh) {
        var size = Math.floor(Math.min(vw, vh) * 0.8);
        return { width: size, height: size };
      },
      aspectRatio: 4 / 3,
      disableFlip: false,
      videoConstraints: {
        facingMode: { ideal: currentFacing },
        width: { ideal: 1920 },
        height: { ideal: 1080 },
        advanced: [{ focusMode: 'continuous' }]
      },
      experimentalFeatures: {
        useBarCodeDetectorIfSupported: true
      }
    };
  }

  function startScanning() {
    if (typeof Html5Qrcode === 'undefined') {
      alert('Không tải được thư viện quét mã. Kiểm tra kết nối mạng rồi thử lại.');
      return;
    }
    toggleBtn.disabled = true;
    statusText.textContent = 'Đang mở camera…';
    if (!html5QrCode) html5QrCode = new Html5Qrcode('reader', { verbose: false });

    html5QrCode.start({}, buildScanConfig(), onScanSuccess, onScanFailure)
      .then(function () {
        setScanningUI(true);
        setupTrackControls();
      })
      .catch(function (err) {
        statusText.textContent = 'Camera đang tắt';
        alert('Không mở được camera. Hãy cấp quyền camera cho trang này trong trình duyệt, rồi thử lại.\n\nChi tiết: ' + err);
      })
      .finally(function () { toggleBtn.disabled = false; });
  }

  function stopScanning(afterStop) {
    if (!html5QrCode) { setScanningUI(false); if (afterStop) afterStop(); return; }
    toggleBtn.disabled = true;
    html5QrCode.stop()
      .then(function () { return html5QrCode.clear(); })
      .catch(function () { /* ignore */ })
      .finally(function () {
        setScanningUI(false);
        toggleBtn.disabled = false;
        if (afterStop) afterStop();
      });
  }

  toggleBtn.addEventListener('click', function () {
    if (scanning) stopScanning(); else startScanning();
  });

  /** ---------- Manual entry ---------- **/
  function manualAdd() {
    var val = manualInput.value.trim();
    if (!val) return;
    registerCode(val, 'Nhập tay');
    manualInput.value = '';
    manualInput.focus();
  }
  manualAddBtn.addEventListener('click', manualAdd);
  manualInput.addEventListener('keydown', function (e) { if (e.key === 'Enter') manualAdd(); });

  clearAllBtn.addEventListener('click', clearAll);

  exportOptionsBtn.addEventListener('click', function () {
    exportPanel.hidden = !exportPanel.hidden;
    exportOptionsBtn.classList.toggle('active', !exportPanel.hidden);
  });

  /** ---------- Export ---------- **/
  var exportFieldDefs = [
    { key: 'format', label: 'Định dạng', wch: 14, get: function (e) { return e.format; } },
    { key: 'count', label: 'Số lần quét', wch: 12, get: function (e) { return e.count; } },
    { key: 'firstTime', label: 'Lần đầu quét', wch: 20, get: function (e) { return e.firstTime.toLocaleString('vi-VN'); } },
    { key: 'lastTime', label: 'Lần quét cuối', wch: 20, get: function (e) { return e.lastTime.toLocaleString('vi-VN'); } }
  ];
  var FIELD_PREFS_KEY = 'quetma_export_fields_v1';

  function fieldCheckbox(key) {
    return document.querySelector('.export-fields input[data-field="' + key + '"]');
  }

  function getSelectedFields() {
    return exportFieldDefs.filter(function (f) {
      var cb = fieldCheckbox(f.key);
      return cb ? cb.checked : true;
    });
  }

  function loadFieldPrefs() {
    try {
      var raw = localStorage.getItem(FIELD_PREFS_KEY);
      if (!raw) return;
      var saved = JSON.parse(raw);
      exportFieldDefs.forEach(function (f) {
        var cb = fieldCheckbox(f.key);
        if (cb && typeof saved[f.key] === 'boolean') cb.checked = saved[f.key];
      });
    } catch (e) { /* ignore */ }
  }

  function saveFieldPrefs() {
    try {
      var state = {};
      exportFieldDefs.forEach(function (f) {
        var cb = fieldCheckbox(f.key);
        state[f.key] = cb ? cb.checked : true;
      });
      localStorage.setItem(FIELD_PREFS_KEY, JSON.stringify(state));
    } catch (e) { /* ignore */ }
  }

  document.querySelectorAll('.export-fields input[data-field]').forEach(function (cb) {
    cb.addEventListener('change', saveFieldPrefs);
  });
  loadFieldPrefs();

  function buildRows() {
    var fields = getSelectedFields();
    var header = ['Mã'].concat(fields.map(function (f) { return f.label; }));
    var rows = [header];
    order.slice().reverse().forEach(function (code) {
      var e = entries.get(code);
      if (!e) return;
      rows.push([e.code].concat(fields.map(function (f) { return f.get(e); })));
    });
    return rows;
  }

  function dateStamp() {
    var d = new Date();
    function p(n) { return String(n).padStart(2, '0'); }
    return d.getFullYear() + '' + p(d.getMonth() + 1) + p(d.getDate()) + '_' + p(d.getHours()) + p(d.getMinutes());
  }

  function defaultFilename() {
    return 'quet-ma_' + dateStamp();
  }

  function sanitizeFilename(name) {
    return name
      .replace(/[\\/:*?"<>|\u0000-\u001f]/g, '')
      .trim()
      .slice(0, 120);
  }

  function resolveFilenameBase() {
    var raw = sanitizeFilename(filenameInput.value || '');
    return raw || defaultFilename();
  }

  function downloadBlob(blob, filename) {
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 2000);
  }

  function doExportCsv(base) {
    var rows = buildRows();
    var csv = rows.map(function (r) {
      return r.map(function (v) {
        var s = String(v).replace(/"/g, '""');
        return '"' + s + '"';
      }).join(',');
    }).join('\r\n');
    var blob = new Blob(['﻿' + csv], { type: 'text/csv;charset=utf-8;' });
    downloadBlob(blob, base + '.csv');
  }

  function doExportXlsx(base) {
    if (typeof XLSX === 'undefined') { alert('Không tải được thư viện xuất Excel. Kiểm tra kết nối mạng rồi thử lại.'); return; }
    var rows = buildRows();
    var ws = XLSX.utils.aoa_to_sheet(rows);
    var fields = getSelectedFields();
    ws['!cols'] = [{ wch: 26 }].concat(fields.map(function (f) { return { wch: f.wch }; }));
    var wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'Ket qua quet');
    XLSX.writeFile(wb, base + '.xlsx');
  }

  /** ---------- Export confirm modal ---------- **/
  var pendingExportType = null;

  function openExportModal(type) {
    if (entries.size === 0) { alert('Chưa có mã nào để xuất.'); return; }
    pendingExportType = type;
    exportModalTitle.textContent = type === 'xlsx' ? 'Xuất Excel' : 'Xuất CSV';
    if (!filenameInput.value) filenameInput.value = defaultFilename();
    exportModalOverlay.hidden = false;
    exportModalConfirm.textContent = type === 'xlsx' ? 'Xuất Excel' : 'Xuất CSV';
    setTimeout(function () { filenameInput.focus(); filenameInput.select(); }, 30);
  }

  function closeExportModal() {
    exportModalOverlay.hidden = true;
    pendingExportType = null;
  }

  exportCsvBtn.addEventListener('click', function () { openExportModal('csv'); });
  exportXlsxBtn.addEventListener('click', function () { openExportModal('xlsx'); });

  exportModalCancel.addEventListener('click', closeExportModal);
  exportModalOverlay.addEventListener('click', function (e) {
    if (e.target === exportModalOverlay) closeExportModal();
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && !exportModalOverlay.hidden) closeExportModal();
  });
  filenameInput.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') exportModalConfirm.click();
  });

  exportModalConfirm.addEventListener('click', function () {
    var base = resolveFilenameBase();
    if (pendingExportType === 'xlsx') doExportXlsx(base); else doExportCsv(base);
    closeExportModal();
  });


  /** ---------- PWA service worker ---------- **/
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('sw.js').catch(function () { /* offline install optional, ignore failure */ });
    });
  }

  renderList();
})();
</script>
</body>
</html>
